<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>База знаний — ProZaik</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <link rel="stylesheet" href="editor-plugin.css?v=3">
  <style>
    :root {
      --theme-color: #2c5f8a;
      --sidebar-width: 280px;
      --sidebar-background: #f8f9fa;
    }
  </style>
</head>
<body>
  <div id="app">Загрузка...</div>
  <script>
    window.$docsify = {
      name: '⚖️ База знаний',
      repo: 'https://github.com/ProZaik/knowledge-wiki',
      loadSidebar: true,
      autoHeader: true,
      subMaxLevel: 2,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Поиск...',
        noData: 'Ничего не найдено',
        depth: 3
      },
      pagination: {
        previousText: '← Назад',
        nextText: 'Вперёд →'
      },
      homepage: 'INDEX.md',
      coverpage: false,
      themeColor: '#2c5f8a',
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      // Mermaid
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === 'mermaid') {
              return '<div class="mermaid">' + code + '</div>';
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      // Скрываем YAML frontmatter (--- ... ---)
      plugins: [
        function(hook) {
          hook.beforeEach(function(content) {
            return content.replace(/^---[\s\S]*?---\n*/m, '');
          });
          hook.doneEach(function() {
            mermaid.run();
          });
        }
      ]
    }
  </script>
  <!-- Mermaid ПЕРЕД docsify -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>mermaid.initialize({ startOnLoad: false, theme: 'default' });</script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="editor-plugin.js?v=3"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
</body>
</html>
